<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINRA - Loading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --vermillon: #c9a227;
            --gold: #d4af37;
            --dark-bg: #030304;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--dark-bg);
            color: #f5f2eb;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* Dégradé de fond chaud et sombre (comme sur le site officiel) */
        .bg-gradient-site {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 30%, rgba(201, 169, 98, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 50% 80%, rgba(212, 175, 55, 0.04) 0%, transparent 60%),
                #030304;
            z-index: -2;
        }

        /* Overlay en parchemin / bruit subtil */
        .bg-texture {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.15;
            z-index: -1;
        }

        /* Canvas pour les braises animées (La volonté du Feu) */
        #embers-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Typographie Serif style "Shinra" */
        .shinra-serif {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.1em;
        }

        /* Effet de lueur dorée/vermillon sur le texte */
        .shinra-title-gradient {
            background: linear-gradient(to bottom, #ffffff 40%, #e8d5a3 80%, #c9a227 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(201, 169, 98, 0.25);
        }

        /* Éléments de l'interface en verre trempé (Glassmorphism de luxe) */
        .panel-glass {
            background: rgba(8, 8, 10, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(201, 169, 98, 0.14);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        /* Barre de progression fluide */
        .progress-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5c4812, #c9a227, #f0e6c8);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.45);
            transition: width 0.6s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        /* Animation douce de pulsation pour le Kanji */
        @keyframes pulse-kanji {
            0%, 100% { opacity: 0.85; transform: scale(1); filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); }
            50% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.7)); }
        }

        .kanji-glow {
            animation: pulse-kanji 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-[1200px]:justify-between h-screen w-screen py-6 md:py-10 px-6 relative space-y-4 md:space-y-6">

    <div class="bg-gradient-site"></div>
    <div class="bg-texture"></div>
    <canvas id="embers-canvas"></canvas>

    <div class="flex flex-col items-center text-center z-10 flex-shrink-0 min-[1200px]:mt-4">
        <div class="kanji-glow text-3xl md:text-4xl font-semibold mb-2 md:mb-3 border border-amber-500/20 px-4 py-1.5 rounded-lg bg-amber-950/20 text-[#d4af37] font-serif tracking-widest">
            神
        </div>
        
        <p class="shinra-serif text-[10px] tracking-[0.4em] text-[#c9a227]/80 uppercase font-semibold mb-1">Bienvenue sur</p>
        <h1 class="shinra-serif shinra-title-gradient text-5xl md:text-8xl font-black tracking-widest leading-none mb-3 md:mb-4">SHINRA</h1>
        
        <div class="flex items-center space-x-4">
            <div class="h-[1px] w-12 bg-gradient-to-r from-transparent to-amber-500/40"></div>
            <p class="text-xs tracking-[0.25em] text-gray-400 font-light uppercase">L'expérience Shinobi ultime</p>
            <div class="h-[1px] w-12 bg-gradient-to-l from-transparent to-amber-500/40"></div>
        </div>
    </div>

    <div class="relative flex-1 w-full max-h-[320px] md:max-h-[420px] min-[1200px]:max-h-[480px] flex items-center justify-center z-10 my-2 border-0 outline-none">
        <div class="absolute w-full h-full max-w-xl bg-amber-500/5 rounded-full blur-3xl pointer-events-none"></div>
        <img src="Shinra-Logo.png" alt="Logo Shinra" class="w-full h-full max-w-xs md:max-w-xl min-[1200px]:max-w-2xl object-contain opacity-85 hover:opacity-100 transition-opacity duration-700 ease-in-out py-2 border-0 outline-none">
    </div>

    <div class="w-full max-w-2xl flex flex-col items-center z-10 px-4 flex-shrink-0 min-[1200px]:mb-4">
        
        <div class="w-full panel-glass rounded-xl p-5 md:p-8 mb-4 md:mb-6">
            <div class="flex justify-between items-end mb-4">
                <div class="flex flex-col">
                    <span class="text-[10px] text-[#d4af37] font-bold tracking-[0.2em] uppercase mb-1">Concentration du Chakra</span>
                    <span id="status" class="text-sm text-gray-300 font-light">Calcul de la trajectoire gravitationnelle...</span>
                </div>
                <span id="percentage" class="text-3xl font-bold text-white italic tracking-tighter">0%</span>
            </div>

            <div class="progress-track mb-3">
                <div id="progress-bar" class="progress-fill"></div>
            </div>

            <div id="filename" class="text-[9px] text-gray-500 truncate text-right font-mono uppercase tracking-widest opacity-60">Réception des rouleaux de techniques...</div>
        </div>

        <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
            <div class="panel-glass rounded-xl p-4 flex flex-col items-center justify-center">
                <span class="text-[9px] text-[#c9a227]/80 uppercase tracking-widest mb-1 font-semibold">Territoire (Map)</span>
                <span id="mapname" class="shinra-serif text-xs font-bold text-gray-200 tracking-wider">Chargement...</span>
            </div>

            <div class="panel-glass rounded-xl p-4 flex flex-col items-center justify-center border-amber-500/30">
                <span class="text-[9px] text-[#d4af37] uppercase tracking-widest mb-1 font-semibold">Portail Web</span>
                <a href="https://shinra-community.fr" target="_blank" class="shinra-serif text-xs font-extrabold text-white tracking-wider hover:text-[#e8d5a3] transition-colors">shinra-community.fr</a>
            </div>

            <div class="panel-glass rounded-xl p-4 flex flex-col items-center justify-center">
                <span class="text-[9px] text-[#c9a227]/80 uppercase tracking-widest mb-1 font-semibold">Ralliement</span>
                <span class="shinra-serif text-xs font-bold text-gray-200 tracking-wider">discord.gg/shinrarp</span>
            </div>
        </div>

        <p class="text-[9px] tracking-[0.4em] text-gray-500/60 uppercase font-light text-center mt-4 md:mt-6">
            Prêt à écrire ta légende ninja ?
        </p>

    </div>

    <script>
        // --- LOGIQUE DES BRAISES EN ARRIÈRE-PLAN ---
        const canvas = document.getElementById('embers-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Ember {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedY = -(Math.random() * 1.2 + 0.4);
                this.speedX = Math.random() * 0.6 - 0.3;
                this.opacity = Math.random() * 0.5 + 0.3;
                const colors = ['#6b5416', '#a88420', '#c9a227', '#d4af37'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.speedX += Math.random() * 0.1 - 0.05;

                if (this.y < height * 0.2) {
                    this.opacity -= 0.005;
                }

                if (this.y < 0 || this.opacity <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        const embers = [];
        const maxEmbers = 35;

        for (let i = 0; i < maxEmbers; i++) {
            embers.push(new Ember());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.shadowBlur = 0;
            for (let i = 0; i < embers.length; i++) {
                embers[i].update();
                embers[i].draw();
            }
            requestAnimationFrame(animate);
        }

        animate();


        // --- INTEGRATION DE L'API DE CHARGEMENT GMOD ---
        // GMod n'appelle SetFilesNeeded qu'à chaque changement de liste, pas à chaque fichier :
        // on compte aussi chaque DownloadingFile (workshop + FastDL) pour une barre fidèle.
        let totalFiles = 0;
        let neededFiles = 0;
        let filesCompleted = 0;
        let maxProgress = 0;
        const seenDownloads = new Set();
        let lastDownloadLabel = "";

        const FINISH_STATUS_KEYS = [
            "sending client info",
            "client info sent",
            "starting lua",
            "lua started",
            "loading map",
            "loaded map",
            "spawning",
            "entering game",
            "workshop complete",
            "download complete",
            "all complete"
        ];

        const NEAR_FINISH_STATUS_KEYS = [
            "mounted",
            "mounting",
            "precache",
            "initializing game"
        ];

        function isFinishPhase(status) {
            const s = (status || "").toLowerCase();
            return FINISH_STATUS_KEYS.some((key) => s.includes(key));
        }

        function isNearFinishPhase(status) {
            const s = (status || "").toLowerCase();
            return NEAR_FINISH_STATUS_KEYS.some((key) => s.includes(key));
        }

        function syncCompletedFromNeeded() {
            if (totalFiles > 0 && neededFiles >= 0) {
                filesCompleted = Math.max(filesCompleted, totalFiles - neededFiles);
            }
        }

        function registerDownload(fileName) {
            if (!fileName || seenDownloads.has(fileName)) return;
            seenDownloads.add(fileName);
            if (totalFiles > 0) {
                filesCompleted = Math.min(totalFiles, filesCompleted + 1);
            } else {
                filesCompleted += 1;
            }
        }

        function updateProgress(forcePercent) {
            let percentage = 0;

            if (typeof forcePercent === "number") {
                percentage = forcePercent;
            } else if (totalFiles > 0) {
                syncCompletedFromNeeded();
                const fromNeeded = Math.round(((totalFiles - neededFiles) / totalFiles) * 100);
                const fromCounter = Math.round((filesCompleted / totalFiles) * 100);
                percentage = Math.max(fromNeeded, fromCounter);
                if (neededFiles === 0) percentage = 100;
            } else if (filesCompleted > 0) {
                // Workshop / téléchargements avant que SetFilesTotal arrive
                percentage = Math.min(88, 12 + Math.round((filesCompleted / Math.max(filesCompleted + 3, 8)) * 76));
            }

            percentage = Math.min(100, Math.max(maxProgress, percentage));
            maxProgress = percentage;

            document.getElementById("progress-bar").style.width = percentage + "%";
            document.getElementById("percentage").innerHTML = percentage + "%";

            if (totalFiles > 0 && !forcePercent) {
                const done = Math.min(filesCompleted, totalFiles);
                const left = Math.max(0, totalFiles - done);
                if (left > 0 && lastDownloadLabel) {
                    document.getElementById("filename").innerHTML =
                        "Ressources : " + done + " / " + totalFiles + " — " + lastDownloadLabel;
                } else if (totalFiles > 0) {
                    document.getElementById("filename").innerHTML =
                        "Ressources : " + done + " / " + totalFiles;
                }
            }
        }

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById("mapname").innerHTML = mapname;
        }

        function SetStatusChanged(status) {
            document.getElementById("status").innerHTML = status;

            if (isFinishPhase(status)) {
                updateProgress(100);
                return;
            }

            if (isNearFinishPhase(status)) {
                updateProgress(Math.max(maxProgress, 96));
                return;
            }

            if (totalFiles > 0 && neededFiles === 0) {
                updateProgress(100);
            }
        }

        function SetFilesTotal(total) {
            totalFiles = Math.max(0, parseInt(total, 10) || 0);
            syncCompletedFromNeeded();
            updateProgress();
        }

        function SetFilesNeeded(needed) {
            neededFiles = Math.max(0, parseInt(needed, 10) || 0);
            syncCompletedFromNeeded();
            if (totalFiles > 0 && neededFiles === 0) {
                filesCompleted = totalFiles;
            }
            updateProgress();
        }

        function DownloadingFile(fileName) {
            lastDownloadLabel = fileName;
            const shortName = fileName.length > 72 ? "…" + fileName.slice(-69) : fileName;
            document.getElementById("filename").innerHTML = "Donnée : " + shortName;
            registerDownload(fileName);
            updateProgress();
        }

        window.GameDetails = GameDetails;
        window.SetStatusChanged = SetStatusChanged;
        window.SetFilesTotal = SetFilesTotal;
        window.SetFilesNeeded = SetFilesNeeded;
        window.DownloadingFile = DownloadingFile;

        if (!navigator.userAgent.includes("GMod")) {
            let p = 0;
            const demoFiles = [
                "shinra_core",
                "shinra_map_pack",
                "shinra_jutsu_nature",
                "shinra_kekkei",
                "shinra_models"
            ];
            totalFiles = demoFiles.length;
            neededFiles = demoFiles.length;

            setInterval(() => {
                if (p < 100) {
                    p++;
                    if (p <= demoFiles.length) {
                        neededFiles = demoFiles.length - p;
                        filesCompleted = p;
                        DownloadingFile(demoFiles[p - 1] || demoFiles[demoFiles.length - 1]);
                    } else {
                        updateProgress(p);
                    }
                    if (p === 15) SetStatusChanged("Malaxage du chakra...");
                    if (p === 50) SetStatusChanged("Lancement de l'illusion...");
                    if (p === 85) SetStatusChanged("Restauration du parchemin de sceau...");
                    if (p === 98) SetStatusChanged("Sending client info...");
                }
            }, 60);
        }
    </script>
</body>
</html>
