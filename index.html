<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINRA - Loading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --vermillon: #e0533c;
            --gold: #d97706;
            --dark-bg: #0b0507;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--dark-bg);
            color: #f3f4f6;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* Dégradé de fond chaud et sombre (comme sur le site officiel) */
        .bg-gradient-site {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 30%, rgba(224, 83, 60, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 50% 80%, rgba(217, 119, 6, 0.04) 0%, transparent 60%),
                #0b0507;
            z-index: -2;
        }

        /* Overlay en parchemin / bruit subtil */
        .bg-texture {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.15;
            z-index: -1;
        }

        /* Canvas pour les braises animées (La volonté du Feu) */
        #embers-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Typographie Serif style "Shinra" */
        .shinra-serif {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.1em;
        }

        /* Effet de lueur dorée/vermillon sur le texte */
        .shinra-title-gradient {
            background: linear-gradient(to bottom, #ffffff 40%, #ff8975 80%, #e0533c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(224, 83, 60, 0.25);
        }

        /* Éléments de l'interface en verre trempé (Glassmorphism de luxe) */
        .panel-glass {
            background: rgba(14, 8, 10, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(224, 83, 60, 0.12);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        /* Barre de progression fluide */
        .progress-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #be123c, #e0533c, #f59e0b);
            box-shadow: 0 0 15px rgba(224, 83, 60, 0.6);
            transition: width 0.6s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        /* Animation douce de pulsation pour le Kanji */
        @keyframes pulse-kanji {
            0%, 100% { opacity: 0.85; transform: scale(1); filter: drop-shadow(0 0 15px rgba(224, 83, 60, 0.4)); }
            50% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(224, 83, 60, 0.7)); }
        }

        .kanji-glow {
            animation: pulse-kanji 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-[1200px]:justify-between h-screen w-screen py-6 md:py-10 px-6 relative space-y-4 md:space-y-6">

    <div class="bg-gradient-site"></div>
    <div class="bg-texture"></div>
    <canvas id="embers-canvas"></canvas>

    <div class="flex flex-col items-center text-center z-10 flex-shrink-0 min-[1200px]:mt-4">
        <div class="kanji-glow text-3xl md:text-4xl font-semibold mb-2 md:mb-3 border border-red-500/20 px-4 py-1.5 rounded-lg bg-red-950/20 text-[#e0533c] font-serif tracking-widest">
            神
        </div>
        
        <p class="shinra-serif text-[10px] tracking-[0.4em] text-amber-500/80 uppercase font-semibold mb-1">Bienvenue sur</p>
        <h1 class="shinra-serif shinra-title-gradient text-5xl md:text-8xl font-black tracking-widest leading-none mb-3 md:mb-4">SHINRA</h1>
        
        <div class="flex items-center space-x-4">
            <div class="h-[1px] w-12 bg-gradient-to-r from-transparent to-red-500/40"></div>
            <p class="text-xs tracking-[0.25em] text-gray-400 font-light uppercase">L'expérience Shinobi ultime</p>
            <div class="h-[1px] w-12 bg-gradient-to-l from-transparent to-red-500/40"></div>
        </div>
    </div>

    <div class="relative flex-1 w-full max-h-[320px] md:max-h-[420px] min-[1200px]:max-h-[480px] flex items-center justify-center z-10 my-2 border-0 outline-none">
        <div class="absolute w-full h-full max-w-xl bg-red-600/5 rounded-full blur-3xl pointer-events-none"></div>
        <img src="Shinra-Logo.png" alt="Logo Shinra" class="w-full h-full max-w-xs md:max-w-xl min-[1200px]:max-w-2xl object-contain opacity-85 hover:opacity-100 transition-opacity duration-700 ease-in-out py-2 border-0 outline-none">
    </div>

    <div class="w-full max-w-2xl flex flex-col items-center z-10 px-4 flex-shrink-0 min-[1200px]:mb-4">
        
        <div class="w-full panel-glass rounded-xl p-5 md:p-8 mb-4 md:mb-6">
            <div class="flex justify-between items-end mb-4">
                <div class="flex flex-col">
                    <span class="text-[10px] text-amber-500 font-bold tracking-[0.2em] uppercase mb-1">Concentration du Chakra</span>
                    <span id="status" class="text-sm text-gray-300 font-light">Calcul de la trajectoire gravitationnelle...</span>
                </div>
                <span id="percentage" class="text-3xl font-bold text-white italic tracking-tighter">0%</span>
            </div>

            <div class="progress-track mb-3">
                <div id="progress-bar" class="progress-fill"></div>
            </div>

            <div id="filename" class="text-[9px] text-gray-500 truncate text-right font-mono uppercase tracking-widest opacity-60">Réception des rouleaux de techniques...</div>
        </div>

        <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
            <div class="panel-glass rounded-xl p-4 flex flex-col items-center justify-center">
                <span class="text-[9px] text-red-500/80 uppercase tracking-widest mb-1 font-semibold">Territoire (Map)</span>
                <span id="mapname" class="shinra-serif text-xs font-bold text-gray-200 tracking-wider">Chargement...</span>
            </div>

            <div class="panel-glass rounded-xl p-4 flex flex-col items-center justify-center border-red-500/30">
                <span class="text-[9px] text-amber-500 uppercase tracking-widest mb-1 font-semibold">Portail Web</span>
                <a href="https://shinra-community.fr" target="_blank" class="shinra-serif text-xs font-extrabold text-white tracking-wider hover:text-red-400 transition-colors">shinra-community.fr</a>
            </div>

            <div class="panel-glass rounded-xl p-4 flex flex-col items-center justify-center">
                <span class="text-[9px] text-red-500/80 uppercase tracking-widest mb-1 font-semibold">Ralliement</span>
                <span class="shinra-serif text-xs font-bold text-gray-200 tracking-wider">discord.gg/shinra</span>
            </div>
        </div>

        <p class="text-[9px] tracking-[0.4em] text-gray-500/60 uppercase font-light text-center mt-4 md:mt-6">
            Prêt à écrire ta légende ninja ?
        </p>

    </div>

    <script>
        // --- LOGIQUE DES BRAISES EN ARRIÈRE-PLAN ---
        const canvas = document.getElementById('embers-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Ember {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedY = -(Math.random() * 1.2 + 0.4);
                this.speedX = Math.random() * 0.6 - 0.3;
                this.opacity = Math.random() * 0.5 + 0.3;
                const colors = ['#e0533c', '#ea580c', '#d97706', '#f59e0b'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.speedX += Math.random() * 0.1 - 0.05;

                if (this.y < height * 0.2) {
                    this.opacity -= 0.005;
                }

                if (this.y < 0 || this.opacity <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        const embers = [];
        const maxEmbers = 35;

        for (let i = 0; i < maxEmbers; i++) {
            embers.push(new Ember());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.shadowBlur = 0;
            for (let i = 0; i < embers.length; i++) {
                embers[i].update();
                embers[i].draw();
            }
            requestAnimationFrame(animate);
        }

        animate();


        // --- INTEGRATION DE L'API DE CHARGEMENT GMOD ---
        let totalFiles = 0;
        let neededFiles = 0;

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('mapname').innerHTML = mapname;
        }

        function SetStatusChanged(status) {
            document.getElementById('status').innerHTML = status;
            if (status.toLowerCase().includes("sending client info")) {
                updateProgress(100);
            }
        }

        function SetFilesTotal(total) {
            totalFiles = total;
            updateProgress();
        }

        function SetFilesNeeded(needed) {
            neededFiles = needed;
            updateProgress();
        }

        function DownloadingFile(fileName) {
            document.getElementById('filename').innerHTML = "Donnée : " + fileName;
        }

        function updateProgress(override) {
            let percentage = 0;
            if (override) {
                percentage = override;
            } else if (totalFiles > 0) {
                percentage = Math.round(((totalFiles - neededFiles) / totalFiles) * 100);
            }
            document.getElementById('progress-bar').style.width = percentage + "%";
            document.getElementById('percentage').innerHTML = percentage + "%";
        }

        if (!navigator.userAgent.includes("GMod")) {
            let p = 0;
            setInterval(() => {
                if (p < 100) {
                    p++;
                    updateProgress(p);
                    if(p === 15) SetStatusChanged("Malaxage du chakra...");
                    if(p === 50) SetStatusChanged("Lancement de l'illusion...");
                    if(p === 85) SetStatusChanged("Restauration du parchemin de sceau...");
                }
            }, 60);
        }
    </script>
</body>
</html>
